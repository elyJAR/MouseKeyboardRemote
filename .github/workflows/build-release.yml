name: Build & Publish Pre-Release APKs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Pre-release tag (e.g. v1.0.0-beta1)'
        required: true
        default: 'v1.0.0-beta1'

jobs:
  build:
    name: Build Android Remote APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper JAR exists
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            mkdir -p gradle/wrapper
            curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APKs
        run: ./gradlew assembleDebug

      - name: Organize Build Artifacts
        run: |
          mkdir -p release_apks
          cp receiver_app/build/outputs/apk/debug/receiver_app-debug.apk release_apks/AndroidTV_Remote_Receiver-v1.0.0.apk
          cp controller_app/build/outputs/apk/debug/controller_app-debug.apk release_apks/Android_Remote_Controller-v1.0.0.apk

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: Android-Remote-APKs
          path: release_apks/

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v1.0.0-beta' }}
          name: 'Android Mouse & Keyboard Remote v1.0.0 (Pre-Release)'
          prerelease: true
          draft: false
          body: |
            ## Pre-Release v1.0.0 Downloads

            ### Attached APKs:
            * **AndroidTV_Remote_Receiver-v1.0.0.apk**: Install on Android TV (Android 9+)
            * **Android_Remote_Controller-v1.0.0.apk**: Install on Mobile Phone / Tablet

            ### Features:
            - Low-latency relative mouse pointer tracking via UDP.
            - Accessibility gesture click & drag injection for non-root Android TV.
            - Floating overlay pointer view (`SYSTEM_ALERT_WINDOW`).
            - TV D-Pad navigation, media keys, and Home/Back key events.
            - Real-time soft keyboard input sync and voice input relay.
            - Auto-pairing over local Wi-Fi via mDNS with PIN code verification.
          files: |
            release_apks/AndroidTV_Remote_Receiver-v1.0.0.apk
            release_apks/Android_Remote_Controller-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
